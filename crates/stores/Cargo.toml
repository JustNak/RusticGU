[package]
name = "stores"
version = "0.1.0"
edition = "2021"
description = "Discover installed game titles from official launcher indexes (no volume walks)."
license = "MIT"
publish = false

# Standalone crate: do not join the repo-root workspace (Engineer 3 owns that).
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
